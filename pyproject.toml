[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-audit"
version = "0.1.0"
description = "Provenance axes and a one-pass hallucination indicator for causal language models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "bartman081523"}]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
hf = ["torch", "transformers"]
nanogpt = ["torch", "tiktoken"]
test = ["pytest"]

[project.scripts]
provenance-audit = "provenance_audit.cli:main"

[tool.setuptools.packages.find]
include = ["provenance_audit*"]
